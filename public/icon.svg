<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512">
  <style>
    /* Light mode: dark navy chip so white aperture pops against Chrome's grey tab bar */
    .bg { fill: #0F1E38; }

    /* Dark mode: slightly deeper for contrast against dark tab bars */
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0B1120; }
    }
  </style>

  <!-- Rounded square background — always dark so white icon is always visible -->
  <rect class="bg" width="512" height="512" rx="100"/>

  <!-- The real Orlume aperture logo PNG, scaled with padding -->
  <image
    href="/images/Orlume_vision_labs_logo._2png.png"
    x="36" y="36"
    width="440" height="440"
    preserveAspectRatio="xMidYMid meet"
  />
</svg>
